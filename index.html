const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTkpX1_GLDWXvnV6k306YOxbxGXmvF_SJJhZKkStzQMSJSfuLwT961RDMHTlIgGyjsnnsrKUjHLhP_G/pub?gid=1031815195&single=true&output=csv';

const categoryAlias={shops:'shops',masters:'masters',products:'produce',produce:'produce',agro:'agro',daily:'daily'};
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;const data=text.replace(/^\uFEFF/,'');for(let i=0;i<data.length;i++){const ch=data[i];if(ch==='"'){if(quoted&&data[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&data[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=ch}row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows}
function cleanPhoto(raw){try{const u=new URL(raw);if(!['https:','http:'].includes(u.protocol))return '';if(u.hostname==='drive.google.com'){const m=u.pathname.match(/\/file\/d\/([^/]+)/);if(m)return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w900';const id=u.searchParams.get('id');if(id)return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w900'}return u.href}catch{return ''}}
function normalizePhone(raw){const digits=String(raw||'').replace(/\D/g,'');return /^\d{10,15}$/.test(digits)?digits:''}
function rowToCard(row,cols){const get=k=>cols[k]===undefined?'':String(row[cols[k]]??'').trim();const category=categoryAlias[get('Категория').toLowerCase()];if(!category||get('Статус').toLowerCase()!=='опубликовано')return null;return {id:get('ID'),category,nameRu:get('Название RU'),nameKz:get('Название KZ'),descRu:get('Описание RU'),descKz:get('Описание KZ'),address:get('Адрес'),hours:get('График работы'),phone:normalizePhone(get('WhatsApp')),photo:cleanPhoto(get('Фото URL')),priceRu:get('Стоимость RU'),priceKz:get('Стоимость KZ')}}
async function loadCards(){loadState='loading';render();try{const url=CSV_URL+'&_='+Date.now();const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const rows=parseCSV(await res.text());if(rows.length<1)throw Error('CSV пустой');const cols={};rows[0].forEach((h,i)=>cols[h.trim()]=i);const required=['ID','Категория','Название RU','Название KZ','Описание RU','Описание KZ','Адрес','График работы','WhatsApp','Фото URL','Статус'];if(required.some(k=>cols[k]===undefined))throw Error('Не совпадают заголовки таблицы');cards=rows.slice(1).map(r=>rowToCard(r,cols)).filter(Boolean);loadState='ok'}catch(e){loadState='error';loadError=e.message;cards=[]}render()}
function cardMarkup(d,idx){const name=esc(t(d.nameRu,d.nameKz)||d.nameRu);const photo=d.photo?`<img src="${esc(d.photo)}" alt="${esc(t('Фото предложения','Ұсыныс фотосуреті'))}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">🏪</span>`:'<span class="fallback">📷</span>';const price=t(d.priceRu,d.priceKz)||d.priceRu||d.priceKz;const priceMarkup=price?`<span class="price-tag">💰 ${esc(t('Стоимость','Құны'))}: ${esc(price)}</span>`:'';const whatsapp=d.phone?`<a class="action" href="https://wa.me/${d.phone}" target="_blank" rel="noopener noreferrer">${t('Написать в WhatsApp','WhatsApp арқылы жазу')}</a>`:t('не указан','көрсетілмеген');return `<article class="entry"><div class="entry-photo">${photo}</div><div class="entry-body"><span class="pill">${t('Карточка предпринимателя','Кәсіпкер карточкасы')}</span><h3>${name}</h3><p>${esc(t(d.descRu,d.descKz))}</p><div class="entry-meta"><span>📍 ${esc(d.address||t('Адрес уточняется','Мекенжай нақтыланады'))}</span><span>🕘 ${esc(d.hours||t('Уточняется','Нақтыланады'))}</span></div>${priceMarkup}<button class="details" onclick="toggleDetails(${idx})">${t('Подробнее о предложении','Толығырақ')} ↓</button><div class="detail-panel hide" id="detail-${idx}"><p><strong>${t('Адрес','Мекенжай')}:</strong> ${esc(d.address||'—')}</p><p><strong>${t('График работы','Жұмыс уақыты')}:</strong> ${esc(d.hours||'—')}</p><p><strong>WhatsApp:</strong> ${whatsapp}</p><p><strong>${t('Отзывы','Пікірлер')}:</strong> ${t('Появятся после подключения и проверки','Қосылып, тексерілгеннен кейін пайда болады')}</p></div></div></article>`}
function toggleDetails(idx){document.getElementById('detail-'+idx)?.classList.toggle('hide')}
function dataNotice(){if(loadState==='loading')return `<div class="panel" role="status">${t('Загружаем карточки из Google Таблицы…','Google кестесінен карточкалар жүктелуде…')}</div>`;if(loadState==='error')return `<div class="panel" role="alert">${t('Не удалось загрузить Google Таблицу. Проверьте CSV-публикацию и подключение к интернету.','Google кестесін жүктеу мүмкін болмады. CSV жарияланымын және интернетті тексеріңіз.')} <button class="action" onclick="loadCards()">${t('Повторить','Қайталау')}</button></div>`;return `<div class="data-status">${t('Данные из Google Таблицы','Google кестесіндегі деректер')} · ${cards.length} <button class="reload-data" onclick="loadCards()">↻ ${t('Обновить','Жаңарту')}</button></div>`}
let lang='ru',page='home';const t=(ru,kz)=>lang==='ru'?ru:kz;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setLang(v){lang=v;document.documentElement.lang=v;document.getElementById('ru').classList.toggle('active',v==='ru');document.getElementById('kz').classList.toggle('active',v==='kz');document.getElementById('hero').textContent=t('Всё нужное рядом!','Қажеттінің бәрі жаныңда!');document.getElementById('subtitle').textContent=t('Цифровая платформа для поддержки сельского бизнеса и поиска товаров и услуг','Ауыл кәсіпкерлігін қолдауға және тауарлар мен қызметтерді іздеуге арналған цифрлық платформа');document.getElementById('search').placeholder=t('Найти товар или услугу...','Тауар немесе қызмет іздеу...');render()}function go(p){page=p;document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const q=document.getElementById('search').value.toLowerCase().trim();document.getElementById('back').classList.toggle('hide',page==='home');document.getElementById('back').textContent=t('← На главную','← Басты бетке');let html='';if(page==='home'){html='<div class="label">'+t('Товары и услуги','Тауарлар мен қызметтер')+'</div><div class="grid">'+categories.slice(0,5).filter(c=>!q||[c[2],c[3],...cards.filter(x=>x.category===c[0]).flatMap(x=>[x.nameRu,x.nameKz,x.descRu,x.descKz])].join(' ').toLowerCase().includes(q)).map(c=>`<button class="tile" onclick="go('${c[0]}')"><span class="emoji">${c[1]}</span>${t(c[2],c[3])}</button>`).join('')+'</div><div class="label ai-heading">✨ '+t('Умные возможности','Ақылды мүмкіндіктер')+'</div><div class="grid ai-zone">'+categories.slice(5).map(c=>`<button class="tile extra" onclick="go('${c[0]}')"><span class="emoji">${c[1]}</span>${t(c[2],c[3])}</button>`).join('')+'</div>'}else if(page==='startup'){html=`<h2>${t('Открой своё дело','Өз ісіңді баста')}</h2><div class="panel"><p>${t('Демонстрационный подбор идей по бюджету. Настоящий ИИ подключим позже.','Бюджет бойынша идеяларды үлгілік таңдау. Нақты ЖИ кейін қосылады.')}</p><label>${t('Стартовый бюджет (₸)','Бастапқы бюджет (₸)')}</label><input class="field" id="budget" type="number" value="200000" min="0"><button class="action" onclick="ideas()">${t('Подобрать идеи','Идеяларды таңдау')}</button><div id="ideaResult" class="result"></div></div>`}else if(page==='needs'){html=`<h2>${t('Какого бизнеса не хватает селу?','Ауылға қандай кәсіп қажет?')}</h2><div class="panel"><p>${t('Учебный опрос: выберите востребованную услугу. Результаты не отправляются на сервер.','Оқу сауалнамасы: қажетті қызметті таңдаңыз. Жауаптар серверге жіберілмейді.')}</p><select id="need" class="field"><option>${t('Ремонт техники','Техника жөндеу')}</option><option>${t('Доставка товаров','Тауар жеткізу')}</option><option>${t('Пекарня','Наубайхана')}</option><option>${t('Парикмахерская','Шаштараз')}</option></select><button class="action" onclick="document.getElementById('needResult').textContent=t('Спасибо! Это демонстрационный ответ.','Рақмет! Бұл демонстрациялық жауап.')">${t('Отправить','Жіберу')}</button><div id="needResult" class="result"></div><small>${t('ИИ-анализ реальных ответов будет добавлен на следующем этапе.','Нақты жауаптарды ЖИ арқылы талдау келесі кезеңде қосылады.')}</small></div>`}else{const c=categories.find(x=>x[0]===page);html=`<h2>${c[1]} ${t(c[2],c[3])}</h2>`+cards.filter(x=>x.category===page&&(!q||[x.nameRu,x.nameKz,x.descRu,x.descKz].join(' ').toLowerCase().includes(q))).map((x,i)=>cardMarkup(x,i)).join('')}document.getElementById('content').innerHTML=dataNotice()+html}function ideas(){const b=Number(document.getElementById('budget').value);const arr=[{min:50000,ru:'Выращивание рассады',kz:'Көшет өсіру'},{min:100000,ru:'Домашняя выпечка',kz:'Үйде нан-тоқаш пісіру'},{min:200000,ru:'Бытовые услуги',kz:'Тұрмыстық қызметтер'}].filter(x=>b>=x.min);document.getElementById('ideaResult').textContent=arr.length?arr.map(x=>'• '+t(x.ru,x.kz)).join('\n'):t('Для этого бюджета примеров пока нет.','Бұл бюджет үшін әзірге мысал жоқ.')}loadCards();
</script></body></html>
