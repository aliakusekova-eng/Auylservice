<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АуылService — цифровое село</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183056;background:#edf4ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#0b2458,#1254b6 65%,#0b9c9a);color:white;padding:22px 18px 35px;border-radius:0 0 28px 28px}main{max-width:980px;margin:auto;padding:16px}header>div{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:25px;font-weight:850}.logo span{color:#69f4cf}.tag{font-size:11px;letter-spacing:2px;opacity:.8}button,input,select,textarea{font:inherit}button{cursor:pointer} .lang button{border:1px solid #ffffff70;background:transparent;color:white;border-radius:9px;padding:7px}.lang button.active{background:white;color:#174b94}h1{font-size:clamp(26px,5vw,42px);margin:27px 0 8px}header p{color:#d7e8ff;max-width:550px}.search{width:100%;max-width:620px;padding:15px 17px;border:0;border-radius:15px;margin-top:14px;outline:0}.label{font-size:19px;font-weight:800;margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:740px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}.tile,.entry,.panel{background:white;border:1px solid #e0e8f6;border-radius:19px;box-shadow:0 7px 18px #174e9310}.tile{padding:20px 15px;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:12px;color:#1c3766;font-weight:750}.tile .emoji{font-size:32px}.tile:hover{border-color:#4388f2;transform:translateY(-2px)}.extra{background:linear-gradient(125deg,#f2eaff,#e4f8ff)}.back{border:0;background:#dce9ff;border-radius:10px;padding:9px 15px;color:#174a94;margin-bottom:15px}.entry{padding:18px;margin:10px 0}.entry h3{margin:0 0 6px}.muted{color:#607490;font-size:14px}.pill{display:inline-block;background:#e7f8ef;color:#167a55;border-radius:30px;padding:5px 10px;font-size:12px;margin-bottom:10px}.fake{font-size:12px;color:#7b688e}.panel{padding:20px;margin:14px 0}.action{border:0;background:#1565dd;color:white;border-radius:12px;padding:12px 16px;margin-top:10px}.action:disabled{background:#9aabc3}.field{display:block;width:100%;border:1px solid #cbd9ee;border-radius:11px;padding:12px;margin:10px 0}.result{background:#eff7ff;border-radius:12px;padding:14px;margin-top:12px;white-space:pre-wrap}.hide{display:none}footer{text-align:center;color:#70819c;font-size:12px;padding:25px}small{color:#617590}

.entry{overflow:hidden;padding:0;transition:transform .2s}.entry:hover{transform:translateY(-2px)}.entry-photo{height:175px;background:linear-gradient(125deg,#dcecff,#d9f7ed);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.entry-photo img{width:100%;height:100%;object-fit:cover}.entry-photo .fallback{font-size:64px}.entry-body{padding:19px}.entry h3{font-size:21px;margin:5px 0 8px}.entry-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.entry-meta span{background:#f0f5ff;border-radius:9px;padding:7px 9px;color:#38577e;font-size:13px}.details{border:1px solid #c8dbf7;background:#f3f8ff;border-radius:10px;padding:10px 13px;color:#1658a9;font-weight:700}.detail-panel{margin-top:14px;padding:14px;background:#f4f8ff;border-radius:12px}.detail-panel p{margin:7px 0}.review{padding:10px;background:#fff;border:1px solid #e3eafa;border-radius:10px;margin:8px 0}.review small{display:block;margin-top:4px}.info-note{background:#e8f6f0;color:#24654f;border-radius:10px;padding:10px;margin-top:12px;font-size:13px}
</style></head><body><header><div><div class="top"><div><div class="logo">Ауыл<span>Service</span></div><div class="tag">SMART VILLAGE · DIGITAL BUSINESS</div></div><div class="lang"><button id="ru" class="active" onclick="setLang('ru')">РУС</button> <button id="kz" onclick="setLang('kz')">ҚАЗ</button></div></div><h1 id="hero">Всё нужное рядом!</h1><p id="subtitle">Цифровая платформа для поддержки сельского бизнеса и поиска товаров и услуг</p><input class="search" id="search" oninput="render()" placeholder="Найти товар или услугу..."></div></header><main><button id="back" class="back hide" onclick="go('home')">← На главную</button><div id="content"></div></main><footer>АуылService · Конкурсный прототип · Все карточки демонстрационные, контакты и реальные заказы отсутствуют.</footer><script>
const categories=[['shops','🏪','Магазины','Дүкендер'],['masters','🛠️','Мастера и ремонт','Шеберлер және жөндеу'],['produce','🥛','Сельская продукция','Ауыл өнімдері'],['agro','🚜','Сельхозуслуги','Ауыл шаруашылығы қызметтері'],['daily','✂️','Бытовые услуги','Тұрмыстық қызметтер'],['startup','💡','Открой своё дело','Өз ісіңді баста'],['needs','📊','Какого бизнеса не хватает?','Ауылға қандай кәсіп қажет?']];
const cards=[['shops','Магазин «Береке»','«Береке» дүкені','Продукты питания и товары для дома','Азық-түлік және үйге қажетті тауарлар'],['shops','Магазин «Уют»','«Жайлы» дүкені','Хозяйственные товары','Шаруашылық тауарлары'],['masters','Мастер-электрик','Электрик шебері','Розетки, освещение и электромонтаж','Розеткалар, жарықтандыру және электр жұмыстары'],['masters','Мастер по ремонту техники','Техника жөндеу шебері','Ремонт бытовой техники','Тұрмыстық техниканы жөндеу'],['produce','Домашняя продукция «Дастархан»','«Дастархан» үй өнімдері','Молоко, сметана и яйца','Сүт, қаймақ және жұмыртқа'],['produce','Домашняя выпечка','Үйде пісірілген нан-тоқаш','Пироги и выпечка на заказ','Тапсырыспен бәліштер мен нан-тоқаш'],['agro','Агроуслуги «Дала»','«Дала» агроқызметтері','Вспашка огорода и покос травы','Жер жырту және шөп шабу'],['agro','Перевозка кормов','Жемшөп тасымалдау','Доставка сена и кормов','Шөп пен жемшөп жеткізу'],['daily','Парикмахерская «Айна»','«Айна» шаштаразы','Стрижки и укладки','Шаш қию және сәндеу'],['daily','Общественная баня','Қоғамдық монша','Банные услуги','Монша қызметтері']];
const cardInfo=[
{icon:'🏪',hours:'09:00–20:00',hoursKz:'09:00–20:00',kind:'Продуктовый магазин',kindKz:'Азық-түлік дүкені',photo:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=900&q=80'},
{icon:'🛒',hours:'09:00–18:00',hoursKz:'09:00–18:00',kind:'Хозяйственный магазин',kindKz:'Шаруашылық дүкені',photo:'https://images.unsplash.com/photo-1601599561213-832382fd07ba?w=900&q=80'},
{icon:'⚡',hours:'По договорённости',hoursKz:'Келісім бойынша',kind:'Электромонтаж',kindKz:'Электр жұмыстары',photo:'https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=900&q=80'},
{icon:'🔧',hours:'По записи',hoursKz:'Алдын ала жазылу',kind:'Ремонт техники',kindKz:'Техника жөндеу',photo:''},
{icon:'🥛',hours:'По договорённости',hoursKz:'Келісім бойынша',kind:'Домашние продукты',kindKz:'Үй өнімдері',photo:'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=900&q=80'},
{icon:'🥐',hours:'По заказу',hoursKz:'Тапсырыс бойынша',kind:'Домашняя выпечка',kindKz:'Үйде пісіру',photo:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=900&q=80'},
{icon:'🚜',hours:'Сезонно',hoursKz:'Маусымдық',kind:'Работы с техникой',kindKz:'Техникамен жұмыс',photo:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=900&q=80'},
{icon:'🚚',hours:'По договорённости',hoursKz:'Келісім бойынша',kind:'Перевозки',kindKz:'Тасымалдау',photo:''},
{icon:'✂️',hours:'10:00–18:00',hoursKz:'10:00–18:00',kind:'Парикмахерская',kindKz:'Шаштараз',photo:'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=900&q=80'},
{icon:'🧖',hours:'По расписанию',hoursKz:'Кесте бойынша',kind:'Общественная баня',kindKz:'Қоғамдық монша',photo:''}
];
function cardMarkup(x){const idx=cards.indexOf(x),d=cardInfo[idx],name=esc(t(x[1],x[2]));const photo=d.photo?`<img src="${d.photo}" alt="${esc(t('Иллюстративное фото','Үлгі фотосурет'))}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${d.icon}</span>`:`<span class="fallback">${d.icon}</span>`;return `<article class="entry"><div class="entry-photo">${photo}</div><div class="entry-body"><span class="pill">${t('Демонстрационная карточка','Үлгі карточка')}</span><h3>${name}</h3><p>${esc(t(x[3],x[4]))}</p><div class="entry-meta"><span>📍 ${t('Привольное','Привольное ауылы')}</span><span>🕘 ${esc(t(d.hours,d.hoursKz))}</span></div><button class="details" onclick="toggleDetails(${idx})">${t('Подробнее о предложении','Толығырақ')} ↓</button><div class="detail-panel hide" id="detail-${idx}"><p><strong>${t('Направление','Бағыты')}:</strong> ${esc(t(d.kind,d.kindKz))}</p><p><strong>${t('Адрес','Мекенжай')}:</strong> ${t('Уточняется','Нақтыланады')}</p><p><strong>WhatsApp:</strong> ${t('пока не подключён','әзірге қосылмаған')}</p><p><strong>${t('Отзывы','Пікірлер')}:</strong> ${t('появятся после проверки реальных отзывов','нақты пікірлер тексерілгеннен кейін пайда болады')}</p><div class="info-note">${t('Фотография иллюстративная, предложение вымышленное. Для настоящего бизнеса контакты публикуются только с согласия владельца.','Фотосурет үлгі ретінде берілген, ұсыныс ойдан шығарылған. Нақты байланыс деректері тек иесінің келісімімен жарияланады.')}</div></div></div></article>`}
function toggleDetails(idx){document.getElementById('detail-'+idx)?.classList.toggle('hide')}
let lang='ru',page='home';const t=(ru,kz)=>lang==='ru'?ru:kz;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setLang(v){lang=v;document.documentElement.lang=v;document.getElementById('ru').classList.toggle('active',v==='ru');document.getElementById('kz').classList.toggle('active',v==='kz');document.getElementById('hero').textContent=t('Всё нужное рядом!','Қажеттінің бәрі жаныңда!');document.getElementById('subtitle').textContent=t('Цифровая платформа для поддержки сельского бизнеса и поиска товаров и услуг','Ауыл кәсіпкерлігін қолдауға және тауарлар мен қызметтерді іздеуге арналған цифрлық платформа');document.getElementById('search').placeholder=t('Найти товар или услугу...','Тауар немесе қызмет іздеу...');render()}function go(p){page=p;document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const q=document.getElementById('search').value.toLowerCase().trim();document.getElementById('back').classList.toggle('hide',page==='home');document.getElementById('back').textContent=t('← На главную','← Басты бетке');let html='';if(page==='home'){html='<div class="label">'+t('Товары и услуги','Тауарлар мен қызметтер')+'</div><div class="grid">'+categories.slice(0,5).filter(c=>!q||[c[2],c[3],...cards.filter(x=>x[0]===c[0]).flat()].join(' ').toLowerCase().includes(q)).map(c=>`<button class="tile" onclick="go('${c[0]}')"><span class="emoji">${c[1]}</span>${t(c[2],c[3])}</button>`).join('')+'</div><div class="label">✨ '+t('Умные возможности','Ақылды мүмкіндіктер')+'</div><div class="grid">'+categories.slice(5).map(c=>`<button class="tile extra" onclick="go('${c[0]}')"><span class="emoji">${c[1]}</span>${t(c[2],c[3])}</button>`).join('')+'</div>'}else if(page==='startup'){html=`<h2>${t('Открой своё дело','Өз ісіңді баста')}</h2><div class="panel"><p>${t('Демонстрационный подбор идей по бюджету. Настоящий ИИ подключим позже.','Бюджет бойынша идеяларды үлгілік таңдау. Нақты ЖИ кейін қосылады.')}</p><label>${t('Стартовый бюджет (₸)','Бастапқы бюджет (₸)')}</label><input class="field" id="budget" type="number" value="200000" min="0"><button class="action" onclick="ideas()">${t('Подобрать идеи','Идеяларды таңдау')}</button><div id="ideaResult" class="result"></div></div>`}else if(page==='needs'){html=`<h2>${t('Какого бизнеса не хватает селу?','Ауылға қандай кәсіп қажет?')}</h2><div class="panel"><p>${t('Учебный опрос: выберите востребованную услугу. Результаты не отправляются на сервер.','Оқу сауалнамасы: қажетті қызметті таңдаңыз. Жауаптар серверге жіберілмейді.')}</p><select id="need" class="field"><option>${t('Ремонт техники','Техника жөндеу')}</option><option>${t('Доставка товаров','Тауар жеткізу')}</option><option>${t('Пекарня','Наубайхана')}</option><option>${t('Парикмахерская','Шаштараз')}</option></select><button class="action" onclick="document.getElementById('needResult').textContent=t('Спасибо! Это демонстрационный ответ.','Рақмет! Бұл демонстрациялық жауап.')">${t('Отправить','Жіберу')}</button><div id="needResult" class="result"></div><small>${t('ИИ-анализ реальных ответов будет добавлен на следующем этапе.','Нақты жауаптарды ЖИ арқылы талдау келесі кезеңде қосылады.')}</small></div>`}else{const c=categories.find(x=>x[0]===page);html=`<h2>${c[1]} ${t(c[2],c[3])}</h2>`+cards.filter(x=>x[0]===page&&(!q||x.join(' ').toLowerCase().includes(q))).map(cardMarkup)}document.getElementById('content').innerHTML=html}function ideas(){const b=Number(document.getElementById('budget').value);const arr=[{min:50000,ru:'Выращивание рассады',kz:'Көшет өсіру'},{min:100000,ru:'Домашняя выпечка',kz:'Үйде нан-тоқаш пісіру'},{min:200000,ru:'Бытовые услуги',kz:'Тұрмыстық қызметтер'}].filter(x=>b>=x.min);document.getElementById('ideaResult').textContent=arr.length?arr.map(x=>'• '+t(x.ru,x.kz)).join('\n'):t('Для этого бюджета примеров пока нет.','Бұл бюджет үшін әзірге мысал жоқ.')}render();
</script></body></html>
